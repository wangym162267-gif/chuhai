name: Deploy Vite to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Unzip and Build
        run: |
          # 1. 解压 zip 压缩包到当前目录
          unzip -o *.zip
          
          # 2. 找到解压出来的项目目录（包含 package.json 的目录）
          TARGET_DIR=$(find . -maxdepth 2 -name "package.json" -exec dirname {} \; | head -n 1)
          echo "Target project directory: $TARGET_DIR"
          
          # 3. 安装依赖并打包
          cd "$TARGET_DIR"
          npm install
          npm run build
          
          # 4. 把打包后的 dist 放到根目录供部署
          mkdir -p $GITHUB_WORKSPACE/output_dist
          cp -r dist/* $GITHUB_WORKSPACE/output_dist/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./output_dist"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
