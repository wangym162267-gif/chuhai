name: Deploy Vite to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract and Build
        run: |
          # 1. 使用 Python 稳妥解压当前目录下的 zip 包（完美支持中文字符）
          python3 -c "
          import zipfile, glob, os
          zips = glob.glob('*.zip')
          if zips:
              with zipfile.ZipFile(zips[0], 'r') as zip_ref:
                  zip_ref.extractall('extracted_project')
          "
          
          # 2. 定位到包含 package.json 的目录
          TARGET_DIR=$(find extracted_project -name "package.json" -exec dirname {} \; | head -n 1)
          if [ -z "$TARGET_DIR" ]; then TARGET_DIR="."; fi
          echo "Found project at: $TARGET_DIR"
          
          # 3. 安装依赖并构建
          cd "$TARGET_DIR"
          npm install
          npm run build
          
          # 4. 将打包生成物复制到部署根目录
          mkdir -p "$GITHUB_WORKSPACE/output_dist"
          cp -r dist/* "$GITHUB_WORKSPACE/output_dist/"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./output_dist"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
